<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entregas e meses da unidade</title>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F9;--surface:#fff;--ink:#1B1B1B;--sub:#55606E;--faint:#8C97A6;
  --line:#E4E7EB;--hair:#EFF2F6;--primary:#1351B4;--primaryDark:#0C326F;--primarySoft:#E8EEF9;
  --navy:#13315C;--green:#168821;--greenSoft:#E3F2E5;--amber:#B86E00;--amberSoft:#FBEEDB;
  --coral:#9E3B1F;--coralSoft:#FAECE7;--grey:#9AA6B2;--greySoft:#EDF0F3;--purple:#5B4AA8;--purpleSoft:#ECE9F8;
  --num:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Raleway,-apple-system,'Segoe UI',sans-serif;color:var(--sub);font-size:14px}
.stripe{height:3px;display:flex}.stripe i{flex:1}
.stripe i:nth-child(1){background:var(--green)}.stripe i:nth-child(2){background:#FFCD07}.stripe i:nth-child(3){background:var(--primary)}

header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.h-linha{padding:11px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.h-t{font-size:15px;font-weight:800;color:var(--navy);letter-spacing:-.01em}
.h-s{font-size:10px;color:var(--faint);font-weight:600;margin-top:1px}
.h-dir{margin-left:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.pill{font-size:10.5px;font-weight:700;color:var(--sub);background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:5px 11px;white-space:nowrap}
.pill.proto{background:var(--purpleSoft);border-color:#D6CFF0;color:var(--purple);font-weight:800;letter-spacing:.05em;text-transform:uppercase;font-size:8.5px}
.h-back{font-size:11px;font-weight:700;color:var(--primary);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px}
.h-back:hover{border-color:var(--primary)}
.bt-pgd{font-size:11px;font-weight:700;border-radius:8px;padding:6px 12px;cursor:pointer;font-family:inherit;
  border:1px solid var(--line);background:#fff;color:var(--sub);display:inline-flex;align-items:center;gap:7px}
.bt-pgd:hover{border-color:var(--purple)}
.bt-pgd.on{background:var(--purpleSoft);border-color:#D6CFF0;color:var(--purple)}
.bt-pgd i{width:7px;height:7px;border-radius:50%;background:var(--line);display:inline-block}
.bt-pgd.on i{background:var(--purple)}

.trilha{display:flex;gap:2px;padding:0 24px;overflow-x:auto;border-top:1px solid var(--hair)}
.bt-exemplo{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 15px;
  font-family:inherit;font-size:11.5px;font-weight:700;color:var(--sub);cursor:pointer;font-style:normal}
.bt-exemplo:hover{border-color:var(--primary);color:var(--primary)}
.tf{display:flex;align-items:center;gap:8px;padding:10px 14px;font-size:11.5px;font-weight:700;color:var(--faint);
  white-space:nowrap;border-bottom:2.5px solid transparent;text-decoration:none}
a.tf:hover{color:var(--primary)}
.tf.on{color:var(--primaryDark);border-bottom-color:var(--primary)}
.tf-opc{margin-left:2px;font-size:8.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;
  background:var(--greySoft);color:var(--faint);border-radius:20px;padding:2px 6px}
.tf-n{width:17px;height:17px;border-radius:50%;background:var(--greySoft);color:var(--sub);font-family:var(--num);font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tf.on .tf-n{background:var(--primary);color:#fff}

.ctx{background:#fff;border-bottom:1px solid var(--line);padding:9px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ctx-u{font-weight:800;color:var(--navy);font-size:13.5px}
.ctx-p{color:var(--faint);font-weight:600;font-size:10.5px}
.ctx-dir{margin-left:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;border-radius:20px;padding:5px 12px;white-space:nowrap;border:1px solid transparent}
.chip.neutro{background:var(--bg);border-color:var(--line);color:var(--sub)}
.chip.neutro b{color:var(--navy);font-family:var(--num)}
.chip.pend{background:var(--amberSoft);border-color:#EAD9BD;color:var(--amber)}
.chip.pend b{font-family:var(--num)}
.chip.plan{background:var(--purpleSoft);border-color:#D6CFF0;color:var(--purple)}
.chip.plan b{font-family:var(--num)}
.chip.ok{background:var(--greenSoft);border-color:#B6DDBB;color:var(--green)}
.bt-cal{display:inline-flex;align-items:center;gap:8px;background:var(--primary);color:#fff;border:0;border-radius:9px;
  padding:8px 14px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:background .15s}
.bt-cal:hover{background:var(--primaryDark)}
.bt-cal .qt{background:rgba(255,255,255,.22);border-radius:20px;padding:1px 7px;font-family:var(--num);font-size:10px}

.wrap{max-width:1080px;margin:0 auto;padding:20px 24px 90px}
.bloco{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:14px}
.tit{font-size:15px;font-weight:800;color:var(--navy);letter-spacing:-.01em}
.sub{font-size:11.5px;color:var(--sub);line-height:1.6;margin-top:4px;max-width:76ch}
.cab{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.cab-dir{margin-left:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap}

/* ---------- barra de visualização + botão da balança ---------- */
.segs{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px}
.seg{border:0;background:none;font-family:inherit;font-size:11px;font-weight:700;color:var(--sub);
  border-radius:8px;padding:6px 11px;cursor:pointer;transition:all .14s;display:inline-flex;align-items:center;gap:6px}
.seg:hover:not(:disabled){background:#fff;color:var(--navy)}
.seg.on{background:#fff;color:var(--primaryDark);box-shadow:0 1px 3px rgba(19,49,92,.13);font-weight:800}
.seg:disabled{opacity:.38;cursor:default}
.seg em{font-style:normal;font-family:var(--num);font-size:9.5px;font-weight:800;color:var(--faint)}
.seg.on em{color:var(--primary)}
.bt-bal{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 11px;cursor:pointer;
  font-family:inherit;font-size:13px;line-height:1;color:var(--sub);display:inline-flex;align-items:center;gap:7px;transition:all .14s}
.bt-bal:hover{border-color:var(--primary);color:var(--primary)}
.bt-bal.on{background:var(--primarySoft);border-color:#C4D6F0;color:var(--primaryDark)}
.bt-bal span{font-size:10.5px;font-weight:800}

/* ---------- grade dos meses ---------- */
.rolagem{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.gq{width:100%;border-collapse:collapse;min-width:600px}
.gq thead th{background:var(--bg);border-bottom:1px solid var(--line);padding:9px 12px;text-align:left;
  font-size:9px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
.gq thead th.med{width:196px}
.gq thead th.mes{text-align:center;width:112px;padding:0}
.gq thead th.mes button{width:100%;border:0;background:none;font-family:inherit;cursor:pointer;padding:8px 6px;
  display:block;transition:background .14s;border-radius:8px}
.gq thead th.mes button:hover{background:#EAEFF6}
.gq thead th.mes b{display:block;font-size:11.5px;color:var(--navy);letter-spacing:0;text-transform:capitalize;font-weight:800}
.gq thead th.mes em{display:block;font-style:normal;font-size:7.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.gq thead th.mes .tro{opacity:0;font-size:8px;color:var(--faint);font-weight:700;letter-spacing:0;text-transform:none;
  display:block;margin-top:2px;transition:opacity .14s}
.gq thead th.mes button:hover .tro{opacity:1}
.hz-plan{color:var(--purple)}.hz-reg{color:var(--primary)}.hz-curso{color:var(--amber)}
.gq tbody td{border-bottom:1px solid var(--hair);padding:9px 12px;vertical-align:middle}
.gq tbody tr.pgd td{border-bottom:1px solid var(--hair);padding:0 12px 12px}
.gq tbody tr:last-child td{border-bottom:0}
.gq tbody tr:hover{background:#FCFDFE}
.e-nome{font-size:12.5px;font-weight:700;color:var(--navy);line-height:1.35}
.e-meta{font-size:9.5px;color:var(--faint);font-weight:600;margin-top:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.e-cod{font-family:var(--num)}
.selo{display:inline-flex;align-items:center;gap:5px;font-size:8.5px;font-weight:800;letter-spacing:.04em;
  text-transform:uppercase;color:var(--faint);background:var(--greySoft);border-radius:20px;padding:2px 8px}
.med-cel{display:flex;align-items:center;gap:8px}
.med-cel select{flex:1;min-width:0}

.td-mes{text-align:center;padding:7px 8px !important}
.cel-meta{display:block;font-size:8.5px;font-weight:800;color:var(--faint);font-family:var(--num);margin-bottom:4px}
.cel{width:100%;text-align:center;font-family:var(--num);font-size:12.5px;font-weight:700;color:var(--navy);
  border:1px solid var(--line);border-radius:8px;padding:8px 4px;background:#fff}
.cel:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 3px rgba(19,81,180,.1)}
.cel.vazio{background:#FCFCFD;border-style:dashed;border-color:#DDE2E8}
.cel.plano{border-color:#D6CFF0;background:#FBFAFE;color:var(--purple)}
.cel.plano:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(91,74,168,.12)}
.cel.plano.vazio{background:#FCFCFD;border-style:dashed;border-color:#DDE2E8;color:var(--navy)}
.cel-sn{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 4px;background:#FCFCFD;border-style:dashed;
  font-family:inherit;font-size:11px;font-weight:800;color:var(--faint);cursor:pointer;transition:all .14s}
.cel-sn:hover{border-color:var(--primary)}
.cel-sn.sim{background:var(--greenSoft);border:1px solid #B6DDBB;color:var(--green)}
.cel-sn.nao{background:#fff;border:1px solid var(--line);color:var(--sub)}
.cel-sn.plano.sim{background:var(--purpleSoft);border-color:#D6CFF0;color:var(--purple)}

/* rodapé da célula: micro-barra + pontinho de "o que aconteceu" */
.pe{display:flex;align-items:center;gap:6px;height:9px;margin-top:6px}
.prog{flex:1;height:3px;border-radius:3px;background:var(--hair);overflow:hidden}
.prog i{display:block;height:100%;border-radius:3px;background:var(--primary);transition:width .3s ease}
.prog i.bom{background:var(--green)}
.prog i.meio{background:var(--primary)}
.prog i.baixo{background:#D9A44A}
.ponto{width:9px;height:9px;border-radius:50%;border:1.5px dashed #C9D2DC;background:none;padding:0;
  cursor:pointer;flex-shrink:0;transition:all .15s}
.ponto:hover{border-color:var(--amber);background:var(--amberSoft);transform:scale(1.25)}
.ponto.on{border:0;background:var(--amber)}
.ponto.on:hover{background:#96590A}

/* ---------- rodapé da tabela ---------- */
.tp{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.bt-add{border:1px dashed var(--line);background:#fff;border-radius:10px;padding:9px 14px;cursor:pointer;
  font-family:inherit;font-size:11.5px;font-weight:700;color:var(--sub);transition:all .14s}
.bt-add:hover{border-color:var(--primary);color:var(--primary);border-style:solid}
.convite{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:11.5px;
  color:var(--sub);font-weight:600;background:#FCFDFE;border:1px solid var(--hair);border-radius:10px;padding:8px 13px}
.convite b{color:var(--navy);font-weight:800}
.convite button{border:0;background:none;font-family:inherit;font-size:11.5px;font-weight:800;
  color:var(--primary);cursor:pointer;padding:0;text-decoration:underline;white-space:nowrap}
.convite button:hover{color:var(--primaryDark)}

/* lista leve de lacunas, quando o gestor pede pra ver */
.ll{border:1px solid var(--hair);border-radius:11px;margin-top:10px;overflow:hidden}
.ll-i{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--hair);flex-wrap:wrap}
.ll-i:last-child{border-bottom:0}
.ll-e{font-size:12px;font-weight:700;color:var(--navy);line-height:1.35}
.ll-q{font-size:10px;color:var(--faint);font-weight:600;margin-top:2px}
.ll-d{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ll-t{font-size:10px;font-weight:700;color:var(--sub);background:var(--bg);border:1px solid var(--line);
  border-radius:20px;padding:3px 10px}
.ll-b{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 12px;cursor:pointer;
  font-family:inherit;font-size:10.5px;font-weight:700;color:var(--primary);white-space:nowrap;transition:all .14s}
.ll-b:hover{border-color:var(--primary);background:var(--primarySoft)}

/* ---------- balãozinho "o que aconteceu" ---------- */
.pop{position:fixed;z-index:70;background:#fff;border:1px solid var(--line);border-radius:14px;
  box-shadow:0 14px 36px -12px rgba(13,49,111,.36);padding:14px 16px;width:296px;display:none}
.pop.on{display:block}
.pop-t{font-size:12.5px;font-weight:800;color:var(--navy);line-height:1.35}
.pop-d{font-size:10px;color:var(--faint);font-weight:600;margin-top:3px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.tag{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 11px;font-family:inherit;
  font-size:10.5px;font-weight:700;color:var(--sub);cursor:pointer;transition:all .14s}
.tag:hover{border-color:var(--primary);color:var(--primary)}
.tag.on{background:var(--primary);border-color:var(--primary);color:#fff}
.pop-pe{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:10px;border-top:1px solid var(--hair)}
.pop-n{font-size:9.5px;color:var(--faint);font-weight:600}
.pop-ok{margin-left:auto;border:0;background:var(--primary);color:#fff;border-radius:8px;padding:6px 14px;
  font-family:inherit;font-size:11px;font-weight:700;cursor:pointer}
.pop-ok:hover{background:var(--primaryDark)}

/* ---------- busca no catálogo ---------- */
.busca{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}
.busca input{flex:1;min-width:240px}
input[type=text],input[type=number],input[type=date],select{font-family:inherit;font-size:12.5px;color:var(--ink);
  border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:#fff;width:100%}
input:focus,select:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 3px rgba(19,81,180,.1)}
select.filtro{width:auto;min-width:170px;font-size:11.5px;padding:8px 10px}
.cx-add{border:1px dashed var(--line);border-radius:12px;padding:16px 18px;margin-top:12px;background:#FCFDFE}
.cx-t{font-size:12.5px;font-weight:800;color:var(--navy);margin-bottom:11px;display:flex;align-items:center;gap:10px}
.cx-t button{margin-left:auto;border:0;background:none;color:var(--faint);font-size:17px;cursor:pointer;line-height:1;padding:0 4px}
.cx-t button:hover{color:var(--navy)}
.res{border:1px solid var(--line);border-radius:11px;overflow:hidden;max-height:270px;overflow-y:auto;background:#fff}
.res-i{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--hair)}
.res-i:last-child{border-bottom:0}
.cod{font-family:var(--num);font-size:10px;font-weight:700;background:var(--primarySoft);color:var(--primaryDark);padding:2px 6px;border-radius:4px;white-space:nowrap}
.res-e{font-size:12.5px;font-weight:700;color:var(--navy);line-height:1.4}
.res-m{font-size:10px;color:var(--faint);font-weight:600;margin-top:3px}
.conta{font-size:11px;color:var(--faint);font-weight:600;margin-bottom:9px}

.ce-cx{border:1px solid #D6CFF0;border-radius:10px;padding:9px 11px;background:#FBFAFE}
.ce-cx.ok{border-color:#B6DDBB;background:var(--greenSoft)}
.ce-cx.sug{border-style:dashed}
.ce-l{font-size:8.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--purple);margin-bottom:5px;display:block}
.ce-cx.ok .ce-l{color:var(--green)}
.obj-l{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.obj-v{font-size:12px;font-weight:700;color:var(--navy);line-height:1.35}
.obj-v.sug{color:var(--purple)}
.obj-v.vazio{color:var(--faint);font-weight:600;font-style:italic}
.obj-eixo{font-size:9px;font-weight:700;color:var(--faint);background:#fff;border:1px solid var(--line);
  border-radius:20px;padding:2px 8px;white-space:nowrap}
.obj-eixo.forte{border-color:#B6DDBB;color:var(--green);background:var(--greenSoft)}
.obj-b{border:1px solid var(--line);background:#fff;border-radius:7px;padding:4px 10px;cursor:pointer;
  font-family:inherit;font-size:10px;font-weight:700;color:var(--sub);margin-left:auto;white-space:nowrap}
.obj-b:hover{border-color:var(--primary);color:var(--primary)}
.obj-b.usar{background:var(--purple);border-color:var(--purple);color:#fff}
.obj-b.usar:hover{background:#4A3C90}
.obj-s{width:auto;max-width:190px;font-size:10.5px;padding:5px 8px}

/* faixa do ciclo do PGD */
.faixa-pgd{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;border:1px solid #D6CFF0;background:#FBFAFE;
  border-radius:11px;padding:11px 15px;margin-bottom:13px}
.fp-l{font-size:8.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--purple);margin-bottom:5px;display:block}
.fp-s{width:auto;min-width:180px;font-size:11.5px;padding:7px 9px}
.fp-v{font-size:12px;font-weight:800;color:var(--navy);font-family:var(--num)}
.fp-v small{display:block;font-family:Raleway;font-size:9px;font-weight:600;color:var(--faint);margin-top:2px}
.fp-dir{margin-left:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap}

/* fechamento do ciclo */
.fc-cab{display:grid;grid-template-columns:1fr 132px 132px 88px;gap:12px;padding:0 0 9px;
  font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.fc-cab span:not(:first-child){text-align:center}
@media(max-width:780px){.fc-cab{display:none}}
.fc-l{display:grid;grid-template-columns:1fr 132px 132px 88px;gap:12px;align-items:center;
  padding:11px 0;border-bottom:1px solid var(--hair)}
.fc-l:last-of-type{border-bottom:0}
@media(max-width:780px){.fc-l{grid-template-columns:1fr 1fr;row-gap:8px}}
.fc-n{text-align:center}
.fc-n b{display:block;font-family:var(--num);font-size:14px;font-weight:800;color:var(--navy);line-height:1}
.fc-n span{font-size:8.5px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}
.fc-p{text-align:center}
.fc-p i{font-style:normal;font-family:var(--num);font-size:12px;font-weight:800;border-radius:20px;padding:5px 11px;display:inline-block}
.fc-p i.bom{background:var(--greenSoft);color:var(--green)}
.fc-p i.meio{background:var(--primarySoft);color:var(--primaryDark)}
.fc-p i.baixo{background:var(--amberSoft);color:var(--amber)}
.fc-p i.nd{background:var(--bg);color:var(--faint)}
.fc-obj{font-size:8.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--purple);
  background:var(--purpleSoft);border-radius:20px;padding:2px 8px}
.fc-obj.sem{color:var(--faint);background:var(--greySoft)}
.fc-aviso{margin-top:13px;border:1px solid #EAD9BD;background:var(--amberSoft);border-radius:10px;
  padding:11px 14px;font-size:11.5px;color:var(--amber);line-height:1.5}

.vazio{border:1px dashed var(--line);border-radius:12px;padding:34px 24px;text-align:center;color:var(--faint);font-size:12px;font-weight:600;line-height:1.7}
.vazio b{color:var(--navy)}

/* ---------- como está o período ---------- */
.falta{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 22px;margin-bottom:14px}
.falta-t{font-size:12.5px;font-weight:800;color:var(--navy);margin-bottom:12px}
.falta-l{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.falta-l li{display:flex;align-items:flex-start;gap:10px;font-size:11.5px;line-height:1.5;color:var(--sub)}

<script>
/* ============================================================
   ENTREGAS E MESES — visão do gestor de unidade.

   COMO A TELA SE ORGANIZA (revisão de 31/07)
   Uma tabela só. Tudo o que era bloco separado virou camada
   dela ou gaveta lateral:
     · COMO cada entrega é medida — coluna da própria tabela,
       recolhida atrás do botão da balança (⚖);
     · QUANTO foi ou será em cada mês — o corpo da tabela, e o
       que a tela mostra sempre;
     · POR QUE não fechou — pontinho discreto na célula onde a
       lacuna nasce, que abre um balãozinho com as etiquetas;
     · QUAIS meses — gaveta da ESQUERDA;
     · DEMANDA REPRIMIDA — gaveta da DIREITA.

   TOM
   Nada de "% da meta" em vermelho embaixo de cada campo: o
   atingimento vira uma micro-barra de 3px, sem número, com o
   detalhe no title. Coral fica reservado para ação destrutiva
   (remover entrega). Estado do trabalho usa cinza / azul /
   verde / âmbar.

   VISUALIZAÇÃO
   A tela não impõe mais o que o gestor deve fazer. Os segmentos
   Tudo / Planejar / Em curso / Registrar filtram as colunas, e
   o cabeçalho de cada mês é clicável para trocar entre meta e
   realizado naquele mês.

   DEMANDA REPRIMIDA
   O gap principal é meta − realizado, que já está na tabela e não
   custa campo nenhum: numa área movida a demanda, a meta mensal é
   basicamente o que se espera que chegue.

   O estoque tem DOIS campos, e não um, porque o campo único do
   sistema atual não deixa claro se é o de antes ou o de agora:
     · "Já estava acumulado" — quando o período começou;
     · "Acumulado hoje"      — agora.
   O segundo é CALCULADO (já estava + gerada no período) e mostrado
   preenchido; o gestor só corrige se a conta não bater com a
   realidade. É ajuda, não mais um campo obrigatório.

   VERSÃO PGD (revisão de 01/08)
   O botão no topo liga o que só o PGD exige. Duas coisas mudaram
   depois de ver o Petrvs de verdade:

     · DATAS NÃO SE DIGITAM. O plano de entregas do PGD já tem
       vigência; escolher o ciclo resolve início e fim de todas
       as entregas de uma vez. Entrega contínua tem por prazo o
       último dia da vigência — recomendação da própria cartilha
       do MGI.
     · O OBJETIVO CHEGA SUGERIDO, com o motivo à mostra: ou
       porque outra entrega do mesmo grupo de processos já foi
       vinculada, ou por quantas palavras-chave batem. Aceitar é
       um clique, e dá para resolver todas de uma vez. Nada é
       decidido às escondidas.

   O FECHAMENTO soma tudo o que aconteceu nos meses do ciclo,
   marcados no calendário ou não — é essa consolidação que o PGD
   avalia no fim do plano. Percentual não se soma: vira média.

   Abrir com ?pgd=1 já liga o botão — é o modelo 05 da régua.

   Números ilustrativos.
   ============================================================ */

const MESES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const ANO = 2026;
const MES_ATUAL = 6;        // julho
const MIN_MESES_DFT = 3;

/* ------------------------------------------------------------
   ETIQUETAS DE CAUSA — lista provisória, FEITA PARA SER TROCADA.
   Pedro ainda vai levantar as que os gestores usam de verdade.
   Mexer aqui basta: o balãozinho se ajusta sozinho à quantidade.
   ------------------------------------------------------------ */
const MOTIVOS = [
  "faltou gente",
  "sistema fora do ar",
  "prioridade mudou",
  "demanda cresceu",
  "travou em outra área",
  "faltou informação",
];

const TIPOS = {
  qtd: {rot:"quantidade",      dica:"quantas vezes no mês", ph:"0", suf:"", acumula:true},
  pct: {rot:"percentual",      dica:"percentual no mês",    ph:"0", suf:"%", acumula:false},
  sn:  {rot:"ocorreu sim/não", dica:"aconteceu ou não",     ph:"—", suf:"",  acumula:false},
};

/* ------------------------------------------------------------
   CICLO DO PGD
   Datas por entrega deixaram de ser digitadas: o plano de
   entregas do PGD já tem vigência, e o prazo de entrega contínua
   é o último dia dessa vigência — é o que a própria cartilha do
   MGI recomenda. Escolher o ciclo resolve as duas datas de todas
   as entregas de uma vez.
   ------------------------------------------------------------ */
const CICLOS = [
  {id:"2026-1", r:"1º semestre de 2026", ini:0,  fim:5},
  {id:"2026-2", r:"2º semestre de 2026", ini:6,  fim:11},
  {id:"2026",   r:"Ano de 2026",         ini:0,  fim:11},
];

/* ------------------------------------------------------------
   OBJETIVOS DO PEI — estrutura igual à do Petrvs (eixo → objetivo).
   `termos` é o que permite o vínculo automático: são as palavras
   que, aparecendo no nome da entrega, indicam o objetivo. Lista
   provisória, feita para ser trocada pelo PEI real do órgão —
   que já está cadastrado no Petrvs.
   ------------------------------------------------------------ */
const OBJETIVOS = [
  {id:"o1", eixo:"Atendimento", t:"Reduzir o tempo de resposta aos pedidos dos servidores",
   termos:"atendimento solicitacao central resposta demanda prazo cadastrais siape"},
  {id:"o2", eixo:"Direitos",    t:"Assegurar a concessão tempestiva de direitos e benefícios",
   termos:"aposentadoria pensao beneficio abono permanencia certidao contribuicao concessao provimento movimentacao ato boletim exercicios pagamento"},
  {id:"o3", eixo:"Saúde",       t:"Ampliar a atenção à saúde do servidor",
   termos:"saude pericia medica afastamento tratamento licenca siass"},
  {id:"o4", eixo:"Pessoas",     t:"Desenvolver competências alinhadas à estratégia",
   termos:"capacitacao desenvolvimento competencia plano anual acao desempenho estagio probatorio avaliacao"},
  {id:"o5", eixo:"Governança",  t:"Fortalecer a governança e a integridade",
   termos:"governanca controle integridade norma normativo nota tecnica legislacao indicador monitoramento acumulacao conformidade"},
];
const objDe = id => OBJETIVOS.find(o=>o.id===id) || null;

const CATALOGO = [
  {c:"11420031", e:"Análise de processo de aposentadoria", m:"Gestão de Pessoas", k:"Aposentadoria"},
  {c:"11420047", e:"Emissão de certidão de tempo de contribuição", m:"Gestão de Pessoas", k:"Aposentadoria"},
  {c:"11420052", e:"Concessão de pensão civil", m:"Gestão de Pessoas", k:"Benefícios"},
  {c:"11420068", e:"Análise de acumulação de cargos", m:"Gestão de Pessoas", k:"Conformidade"},
  {c:"11420073", e:"Instrução de processo de licença capacitação", m:"Gestão de Pessoas", k:"Desenvolvimento"},
  {c:"11420089", e:"Homologação de perícia médica oficial", m:"Saúde do Servidor", k:"Perícia"},
  {c:"11420094", e:"Registro de afastamento para tratamento de saúde", m:"Saúde do Servidor", k:"Afastamentos"},
  {c:"11420108", e:"Elaboração de plano anual de capacitação", m:"Desenvolvimento de Pessoas", k:"Planejamento"},
  {c:"11420115", e:"Execução de ação de desenvolvimento", m:"Desenvolvimento de Pessoas", k:"Capacitação"},
  {c:"11420127", e:"Avaliação de desempenho em estágio probatório", m:"Gestão de Pessoas", k:"Desempenho"},
  {c:"11420133", e:"Movimentação de servidor entre unidades", m:"Gestão de Pessoas", k:"Movimentação"},
  {c:"11420146", e:"Provimento de cargo efetivo por concurso", m:"Gestão de Pessoas", k:"Provimento"},
  {c:"11420159", e:"Cálculo de exercícios anteriores", m:"Gestão de Pessoas", k:"Pagamento"},
  {c:"11420164", e:"Resposta a demanda de órgão de controle", m:"Governança", k:"Controle"},
  {c:"11420178", e:"Atendimento a solicitação via central de serviços", m:"Atendimento", k:"Central"},
  {c:"11420185", e:"Publicação de ato de pessoal no boletim", m:"Gestão de Pessoas", k:"Atos"},
  {c:"11420193", e:"Manutenção de dados cadastrais no SIAPE", m:"Gestão de Pessoas", k:"Cadastro"},
  {c:"11420207", e:"Instrução de processo de abono de permanência", m:"Gestão de Pessoas", k:"Aposentadoria"},
  {c:"11420214", e:"Nota técnica sobre legislação de pessoal", m:"Governança", k:"Normativo"},
  {c:"11420228", e:"Monitoramento de indicadores de gestão de pessoas", m:"Governança", k:"Monitoramento"},
];

/* estado compartilhado com as outras telas da jornada */
const CHAVE_JORNADA = "jornada-gestor-mgi";
function lerPassos(){ try{ return JSON.parse(localStorage.getItem(CHAVE_JORNADA)||"{}"); }catch(e){ return {}; } }
function gravarPasso(k,v){
  try{ const j=lerPassos(); j[k]=v; localStorage.setItem(CHAVE_JORNADA, JSON.stringify(j)); }catch(e){}
}
/* O vínculo entrega→objetivo é o MESMO dado nesta tela e na de
   planejamento — não duas cópias que divergem na primeira edição.
   Por isso ele mora no estado compartilhado, e as duas telas
   gravam e leem daqui. O ciclo vai junto porque resolve as datas. */
function gravarPlanejamento(){
  const objs={}; est.entregas.forEach(e=>{ if(e.obj) objs[e.c]=e.obj; });
  gravarPasso("planejamento", {ciclo:est.ciclo, objs});
}
function lerPlanejamento(){
  const p = lerPassos().planejamento; if(!p) return;
  if(p.ciclo && CICLOS.some(c=>c.id===p.ciclo)) est.ciclo = p.ciclo;
  const objs = p.objs||{};
  est.entregas.forEach(e=>{ if(objs[e.c] && objDe(objs[e.c])) e.obj = objs[e.c]; });
}
function limparPassos(){ try{ localStorage.removeItem(CHAVE_JORNADA); }catch(e){} }
function limparPasso(k){ try{ const j=lerPassos(); delete j[k]; localStorage.setItem(CHAVE_JORNADA, JSON.stringify(j)); }catch(e){} }

/* Demonstração — não é dado de ninguém. Fica fora do estado inicial para o
   gestor abrir a tela limpa; o botão "ver um exemplo" carrega isto. */
const EXEMPLO_ENTREGAS = [
  {c:"11420031", e:"Análise de processo de aposentadoria", m:"Gestão de Pessoas", tipo:"qtd", obj:null},
  {c:"11420089", e:"Homologação de perícia médica oficial", m:"Saúde do Servidor", tipo:"qtd", obj:null},
  {c:"11420108", e:"Elaboração de plano anual de capacitação", m:"Desenvolvimento de Pessoas", tipo:"pct", obj:null},
  {c:"11420164", e:"Resposta a demanda de órgão de controle", m:"Governança", tipo:"sn", obj:null},
  {c:"11420178", e:"Atendimento a solicitação via central de serviços", m:"Atendimento", tipo:"qtd", obj:null},
];
const EXEMPLO_MESES = [3,4,5];

/* mesma unidade escolhida na Primeira etapa/Catálogo de entregas (chave
   gravada pelo portal principal em portal-frontend.jsx) -- sem isso essa
   tela ficava presa na CGGP de exemplo, desconectada do que o gestor
   preencheu nas etapas 1 e 2. */
function lerUnidadePortal(){
  try{
    const cru = localStorage.getItem("portal:unidade");
    if(!cru) return null;
    const d = JSON.parse(cru);
    if(!d.orgao && !d.unidade) return null;
    return {s: d.unidade||d.orgao, n: d.unidade||d.orgao, pai: d.unidade?d.orgao:""};
  }catch(e){ return null; }
}

const $ = id => document.getElementById(id);
const chave = (c,i) => c+"|"+i;
const norm = s => (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const fmt = n => (n==null||isNaN(n)) ? "—" : Math.round(n).toLocaleString("pt-BR");
const cheio = v => v!==undefined && v!=="" && v!==null;
const temMeta = (c,i) => cheio(est.meta.get(chave(c,i)));
const temReal = (c,i) => cheio(est.real.get(chave(c,i)));
const mesesEmDft = () => new Set(est.retratos.flatMap(r=>r.meses));
const acumula = e => TIPOS[e.tipo].acumula;

function horizonte(i){
  if(mesesEmDft().has(i)) return "fechado";
  if(i < MES_ATUAL) return "passado";
  if(i === MES_ATUAL) return "corrente";
  return "futuro";
}

/* o que a coluna pede: meta ou realizado. O horizonte dá o padrão,
   o gestor troca clicando no cabeçalho do mês. */
function modoDe(i){
  const m=est.modo.get(i);
  if(m) return m;
  return horizonte(i)==="futuro" ? "meta" : "real";
}
function rotuloModo(i){
  const m=modoDe(i);
  if(m==="meta") return {txt:"meta", cls:"hz-plan"};
  return horizonte(i)==="corrente" ? {txt:"em curso", cls:"hz-curso"} : {txt:"realizado", cls:"hz-reg"};
}

function statusMes(i){
  if(horizonte(i)==="fechado") return {k:"ok", r:"fechado"};
  if(!est.entregas.length) return {k:"br", r:"em branco"};
  const n=est.entregas.length;
  if(horizonte(i)==="futuro"){
    const p=est.entregas.filter(e=>temMeta(e.c,i)).length;
    if(!p) return {k:"br", r:"sem plano"};
    return p<n ? {k:"pl", r:p+" de "+n} : {k:"pl", r:"planejado"};
  }
  const p=est.entregas.filter(e=>temReal(e.c,i)).length;
  if(!p) return {k:"br", r: horizonte(i)==="corrente" ? "em curso" : "sem registro"};
  return p<n ? {k:"pa", r:p+" de "+n} : {k:"ok", r:"registrado"};
}

const mesesFechaveis = () => MESES.map((_,i)=>i)
  .filter(i => i<MES_ATUAL && est.entregas.length && est.entregas.every(e=>temReal(e.c,i)));
function mesesIneditos(){ const u=mesesEmDft(); return mesesFechaveis().filter(i=>!u.has(i)); }
const mesesPlanejados = () => MESES.map((_,i)=>i)
  .filter(i => horizonte(i)==="futuro" && est.entregas.length && est.entregas.every(e=>temMeta(e.c,i)));

function atingimento(e,i){
  const m=est.meta.get(chave(e.c,i)), r=est.real.get(chave(e.c,i));
  if(!cheio(m)||!cheio(r)) return null;
  if(e.tipo==="sn") return (r==="sim") ? 100 : 0;
  const mm=+m; if(!mm) return null;
  return Math.round(100*(+r)/mm);
}
/* cores da micro-barra — nenhuma delas é coral. Coral só destrói. */
const faixaAt = p => p==null ? "" : p>=100 ? "bom" : p>=70 ? "meio" : "baixo";

/* ============================================================
   CICLO DO PGD E OBJETIVO AUTOMÁTICO
   ============================================================ */
const cicloAtual = () => CICLOS.find(c=>c.id===est.ciclo) || CICLOS[0];
const ultimoDia = m => new Date(ANO, m+1, 0).getDate();
/* as datas de TODA entrega saem do ciclo — ninguém digita data */
function datasDoCiclo(){
  const c=cicloAtual();
  return {ini:`01/${String(c.ini+1).padStart(2,"0")}/${ANO}`,
          fim:`${ultimoDia(c.fim)}/${String(c.fim+1).padStart(2,"0")}/${ANO}`};
}
const mesesDoCiclo = () => { const c=cicloAtual(); const o=[]; for(let i=c.ini;i<=c.fim;i++) o.push(i); return o; };

/* Sugestão do objetivo, em duas camadas e nessa ordem:
     1. MEMÓRIA — se outra entrega do mesmo grupo de processos já
        foi vinculada, é quase certo que esta vai no mesmo lugar;
     2. TERMOS — quantas palavras-chave do objetivo aparecem no
        nome da entrega.
   A confiança fica à mostra: o gestor aceita ou troca, nunca
   descobre depois que algo foi decidido por ele às escondidas. */
function sugerirObjetivo(e){
  const irmao = est.entregas.find(x=>x.c!==e.c && x.m===e.m && x.obj);
  if(irmao) return {id:irmao.obj, via:`outra entrega de ${e.m}`, forte:true};
  const nome = norm(e.e), macro = norm(e.m);
  let melhor=null, max=0, viaMacro=false;
  for(const o of OBJETIVOS){
    const ts = o.termos.split(" ").filter(Boolean);
    const pNome  = ts.filter(t=>nome.includes(t)).length;
    const pMacro = ts.filter(t=>macro.includes(t)).length;
    /* o grupo de processos pesa o dobro: é a classificação oficial da
       entrega, sinal mais confiável que uma palavra solta do título.
       Sem esse peso, "resposta a demanda de órgão de CONTROLE" ia
       parar em "tempo de RESPOSTA" só por empate de contagem. */
    const p = pNome + pMacro*2;
    if(p>max){ max=p; melhor=o; viaMacro=pMacro>0; }
  }
  if(!melhor || !max) return null;
  const via = viaMacro ? `grupo de processos`
            : `${max} ${max===1?"termo":"termos"} em comum`;
  return {id:melhor.id, via, forte:max>=3};
}
const semObjetivo = () => est.entregas.filter(e=>!e.obj);
const sugeriveis = () => semObjetivo().filter(e=>sugerirObjetivo(e));

function vincularSugeridas(){
  /* em duas passadas: as fortes primeiro, para que a memória
     do grupo de processos ajude as fracas na segunda volta */
  for(const passo of [true,false])
    for(const e of est.entregas){
      if(e.obj) continue;
      const s=sugerirObjetivo(e);
      if(s && s.forte===passo) e.obj=s.id;
    }
  gravarPlanejamento();
  render();
}

/* fechamento do ciclo: soma tudo o que aconteceu nos meses do
   ciclo, esteja ou não marcado no calendário */
function fechamentoCiclo(e){
  let meta=0, real=0, mm=0, mr=0;
  for(const i of mesesDoCiclo()){
    const m=est.meta.get(chave(e.c,i)), r=est.real.get(chave(e.c,i));
    if(e.tipo==="sn"){
      if(cheio(m)){ meta+= m==="sim"?1:0; mm++; }
      if(cheio(r)){ real+= r==="sim"?1:0; mr++; }
      continue;
    }
    if(cheio(m)){ meta+=+m; mm++; }
    if(cheio(r)){ real+=+r; mr++; }
  }
  /* percentual não se soma: a leitura do ciclo é a média dos meses */
  if(e.tipo==="pct"){
    return {meta: mm?meta/mm:null, real: mr?real/mr:null, mm, mr, media:true};
  }
  return {meta: mm?meta:null, real: mr?real:null, mm, mr, media:false};
}

/* ============================================================
   DEMANDA REPRIMIDA
   gerada no período = Σ (meta − realizado), só nas entregas que
   acumulam. Acumulado hoje = já estava + gerada, salvo correção.
   ============================================================ */
function geradaNoPeriodo(e){
  if(!acumula(e)) return null;
  let s=0, meses=0;
  for(let i=0;i<MESES.length;i++){
    const m=est.meta.get(chave(e.c,i)), r=est.real.get(chave(e.c,i));
    if(!cheio(m)||!cheio(r)) continue;
    s += (+m)-(+r); meses++;
  }
  return meses ? {s, meses} : {s:0, meses:0};
}
function acumuladoHoje(e){
  const g=geradaNoPeriodo(e);
  if(!g) return null;
  const jaEstava = +est.antes.get(e.c) || 0;
  const calc = jaEstava + g.s;
  const corr = est.agora.get(e.c);
  return cheio(corr) ? {v:+corr, calc, corrigido:true} : {v:calc, calc, corrigido:false};
}

/* lacunas: onde o realizado ficou abaixo da meta.
   Só nos meses que o gestor marcou — o convite fala do período que
   ele está olhando, não do ano inteiro. */
function lacunas(){
  const out=[];
  for(const e of est.entregas){
    for(const i of est.mesesSel){
      if(modoDe(i)==="meta") continue;
      const m=est.meta.get(chave(e.c,i)), r=est.real.get(chave(e.c,i));
      if(!cheio(m)||!cheio(r)) continue;
      if(e.tipo==="sn"){ if(m==="sim"&&r==="nao") out.push({e,i,falta:null}); continue; }
      const d=(+m)-(+r);
      if(d>0) out.push({e,i,falta:d});
    }
  }
  return out.sort((a,b)=>a.i-b.i || (b.falta||0)-(a.falta||0));
}
const causasDe = (c,i) => est.causas.get(chave(c,i)) || [];
const temLacuna = (e,i) => {
  if(modoDe(i)==="meta") return false;
  const m=est.meta.get(chave(e.c,i)), r=est.real.get(chave(e.c,i));
  if(!cheio(m)||!cheio(r)) return false;
  if(e.tipo==="sn") return m==="sim" && r==="nao";
  return (+m)-(+r) > 0;
};
const semCausa = () => lacunas().filter(x=>!causasDe(x.e.c,x.i).length);

/* meses visíveis: os marcados no calendário, filtrados pelo segmento */
function mesesVisiveis(){
  const sel=[...est.mesesSel].sort((a,b)=>a-b);
  if(est.visao==="tudo") return sel;
  return sel.filter(i=>{
    const h=horizonte(i);
    if(est.visao==="planejar")  return h==="futuro";
    if(est.visao==="curso")     return h==="corrente";
    return h==="passado" || h==="fechado";
  });
}
function contaVisao(v){
  const sel=[...est.mesesSel];
  if(v==="tudo") return sel.length;
  return sel.filter(i=>{
    const h=horizonte(i);
    if(v==="planejar") return h==="futuro";
    if(v==="curso")    return h==="corrente";
    return h==="passado" || h==="fechado";
  }).length;
}

function pendencias(){
  const sel=[...est.mesesSel].sort((a,b)=>a-b);
  let registrar=0, planejar=0; const porMes=[], prontos=[];
  for(const i of sel){
    const plan = modoDe(i)==="meta";
    const faltam = est.entregas.filter(e => plan ? !temMeta(e.c,i) : !temReal(e.c,i)).length;
    if(plan) planejar+=faltam; else registrar+=faltam;
    if(faltam) porMes.push({i, faltam, plan}); else prontos.push({i, plan});
  }
  return {registrar, planejar, porMes, prontos, sel};
}

/* Dois passos, não três: pessoas e indicadores viraram uma tela só

/* uma faixa só, com o que o PGD precisa saber do plano inteiro:

function textoDeApoio(sel){
  if(!est.mesesSel.size) return `Escolha os meses e preencha o que já saiu ou o que se espera.`;
  const temPlan=sel.some(i=>modoDe(i)==="meta"), temReg=sel.some(i=>modoDe(i)!=="meta");
  if(temPlan&&temReg) return `Meses por vir pedem a meta; meses encerrados pedem o realizado. O cabeçalho de cada mês diz qual é qual — e pode ser trocado com um clique.`;
  if(temPlan) return `Defina a meta de cada entrega nos meses à frente.`;
  return `A meta aparece acima do campo e você registra o que saiu.`;
}

function barraVisao(){
  const itens=[["tudo","Tudo"],["planejar","Planejar"],["curso","Em curso"],["registrar","Registrar"]];
  return `<div class="segs">${itens.map(([k,r])=>{

      onclick="setVisao('${k}')">${r}${n?`<em>${n}</em>`:``}</button>`;

function linha(e,sel){
  const medida = est.medidaAberta
    ? `<td class="med"><div class="med-cel">
        <select onchange="setTipo('${e.c}',this.value)" title="${TIPOS[e.tipo].dica}">
          ${Object.entries(TIPOS).map(([k,t])=>
            `<option value="${k}" ${e.tipo===k?"selected":""}>${t.rot}</option>`).join("")}
        </select>
        <button class="bt-x" onclick="remover('${e.c}')" title="tirar da unidade">×</button>
      </div></td>`
    : ``;
  const pgdLinha = (est.medidaAberta && est.pgd)
    ? `<tr class="pgd"><td colspan="${2+sel.length}">${caixaObjetivo(e)}</td></tr>`
    : ``;
  return `<tr>
    <td><div class="e-nome">${e.e}</div>
      <div class="e-meta"><span class="e-cod">${e.c}</span>
        ${est.medidaAberta?`<span>${e.m}</span>`:`<span class="selo">⚖ ${TIPOS[e.tipo].rot}</span>`}</div></td>
    ${medida}
    ${sel.map(i=>`<td class="td-mes">${celula(e,i)}</td>`).join("")}
  </tr>${pgdLinha}`;
}

/* O objetivo do PEI não se pergunta em branco: a tela chega com a
   sugestão pronta e o porquê dela ao lado. Um clique aceita. */
function caixaObjetivo(e){
  if(e.obj){
    const o=objDe(e.obj);

const celula = (e,i) => modoDe(i)==="meta" ? celulaPlano(e,i) : celulaRegistro(e,i);

function celulaPlano(e,i){
  const v=est.meta.get(chave(e.c,i));
  const corpo = e.tipo==="sn"
    ? `<button class="cel-sn plano ${v==="sim"?"sim":v==="nao"?"nao":""}" onclick="girarSN('${e.c}',${i},'meta')">
        ${v==="sim"?"prevista":v==="nao"?"não prevista":"—"}</button>`
    : `<input type="number" class="cel plano ${cheio(v)?"":"vazio"}" min="0" placeholder="${TIPOS[e.tipo].ph}"
        value="${cheio(v)?v:""}" title="meta de ${MESES[i]}" oninput="setValor('meta','${e.c}',${i},this.value,this)">`;
  return corpo + `<div class="pe" id="pe${e.c}_${i}"></div>`;
}

function celulaRegistro(e,i){
  const k=chave(e.c,i), m=est.meta.get(k), r=est.real.get(k);
  const suf=TIPOS[e.tipo].suf;
  const linhaMeta = cheio(m)
    ? `<span class="cel-meta">meta ${e.tipo==="sn" ? (m==="sim"?"prevista":"não prevista") : m+suf}</span>`
    : `<span class="cel-meta" style="opacity:.5">sem meta</span>`;
  const corpo = e.tipo==="sn"
    ? `<button class="cel-sn ${r==="sim"?"sim":r==="nao"?"nao":""}" onclick="girarSN('${e.c}',${i},'real')">
        ${r==="sim"?"sim":r==="nao"?"não":"—"}</button>`
    : `<input type="number" class="cel ${cheio(r)?"":"vazio"}" min="0" placeholder="${TIPOS[e.tipo].ph}"
        value="${cheio(r)?r:""}" title="realizado de ${MESES[i]}" oninput="setValor('real','${e.c}',${i},this.value,this)">`;
  return linhaMeta + corpo + `<div class="pe" id="pe${e.c}_${i}">${rodapeCelula(e,i)}</div>`;
}

/* micro-barra + pontinho. Sem número, sem vermelho: o detalhe
   fica no title, e a cor só distingue "fechou" de "ficou perto"
   de "ficou longe". */
function rodapeCelula(e,i){
  if(modoDe(i)==="meta") return "";
  const at=atingimento(e,i);
  if(at==null) return "";
  const k=chave(e.c,i);
  const larg=Math.max(3, Math.min(100, at));
  const suf=TIPOS[e.tipo].suf;
  const detalhe = e.tipo==="sn"
    ? (est.real.get(k)==="sim" ? "ocorreu, como previsto" : "estava prevista e não ocorreu")
    : `${fmt(est.real.get(k))}${suf} de ${fmt(est.meta.get(k))}${suf}`;
  const barra = `<div class="prog" title="${detalhe}"><i class="${faixaAt(at)}" style="width:${larg}%"></i></div>`;
  if(!temLacuna(e,i)) return barra;
  const c=causasDe(e.c,i);
  const dica = c.length ? c.join(", ") : "o que aconteceu?";
  return barra + `<button class="ponto ${c.length?"on":""}" title="${dica}"
    onclick="abrirPop(event,'${e.c}',${i})" aria-label="${dica}"></button>`;
}

function buscar(){
  const t=norm(est.termo).trim();
  return CATALOGO.filter(x=>{
    if(est.macro && x.m!==est.macro) return false;
    if(t.length>=2 && !norm(x.e).includes(t) && !String(x.c).includes(t)) return false;
    return true;
  });
}

/* ---------- como está o período: começa pelo que já está feito ---------- */
function blocoPeriodo(){
  const p=pendencias(), itens=[];

  if(p.prontos.length){
    const reg=p.prontos.filter(x=>!x.plan).map(x=>MESES[x.i]);
    const pl =p.prontos.filter(x=> x.plan).map(x=>MESES[x.i]);
    if(reg.length) itens.push({k:"ok", txt:`<b>${reg.join(", ")}</b> ${reg.length===1?"está":"estão"} com todas as entregas preenchidas.`});
    if(pl.length)  itens.push({k:"pl", txt:`<b>${pl.join(", ")}</b> ${pl.length===1?"já tem meta":"já têm meta"} em todas as entregas.`});
  }
  for(const x of p.porMes) itens.push({k: x.plan?"pl":"az",
    txt: x.plan
      ? `Faltam <b>${x.faltam}</b> ${x.faltam===1?"meta":"metas"} em <b>${MESES[x.i]}</b>.`
      : `Faltam <b>${x.faltam}</b> ${x.faltam===1?"registro":"registros"} em <b>${MESES[x.i]}</b>.`});
  if(!p.sel.length) itens.push({k:"nt", txt:`Nenhum mês marcado ainda — abra a aba <b>Meses</b>, à esquerda.`});

  const reqs=requisitos(), prontos=reqs.filter(r=>r.ok), pend=reqs.filter(r=>!r.ok);
  for(const r of prontos) itens.push({k:"ok", txt:`<b>${r.t}</b> — ${r.d}.`});
  if(!pend.length) itens.push({k:"ok", txt:`Os dois passos estão fechados — dá para gerar o DFT.`});
  else itens.push(...pend.map(r=>({k:"at", txt:`<b>${r.t}</b>: ${r.d}.`})));

  return `<div class="falta">
    <div class="falta-t">Como está o período</div>
    <ul class="falta-l">${itens.map(x=>`<li><span class="pt ${x.k}"></span><span>${x.txt}</span></li>`).join("")}</ul>
  </div>`;
}

/* O dimensionamento cobre um período CONTÍNUO: buraco no meio quebra o DFT.
   Por isso a marcação de meses é sempre um intervalo — clicar num mês distante
   puxa todos os do caminho. Clicar numa ponta encurta; clicar no meio encerra
   o intervalo ali. Mês já travado (que entrou num DFT gerado) fica de fora. */
function alternarMes(i){
  if(horizonte(i)==="fechado") return avisarTravado(i);
  const sel=[...est.mesesSel].sort((a,b)=>a-b);
  let ini, fim;
  if(!sel.length){ ini=fim=i; }
  else{
    const min=sel[0], max=sel[sel.length-1];
    if(!est.mesesSel.has(i)){ ini=Math.min(min,i); fim=Math.max(max,i); }   // estende e preenche o caminho
    else if(sel.length===1){ est.mesesSel=new Set(); render(); return; }    // desmarca o único
    else if(i===min){ ini=i+1; fim=max; }                                   // encurta pelo começo
    else if(i===max){ ini=min; fim=i-1; }                                   // encurta pelo fim
    else{ ini=min; fim=i; }                                                 // clique no meio: termina aqui
  }
  const novo=new Set();
  for(let k=ini;k<=fim;k++) if(horizonte(k)!=="fechado") novo.add(k);
  est.mesesSel=novo;
  render();
}
function avisarTravado(i){
  alert(MESES[i]+"/"+ANO+" já entrou num DFT gerado.\n\nOs números dele ficam como estavam na geração.");
}

function abrirBusca(){ est.buscaAberta=!est.buscaAberta; renderCorpo(); }
function verLacunas(){ est.verLacunas=!est.verLacunas; renderCorpo(); }
function setMacro(v){ est.macro=v; renderCorpo(); }
let tmr=null;
function digitar(v){ est.termo=v; clearTimeout(tmr); tmr=setTimeout(renderCorpo,150); }
function adicionar(cod){
  const x=CATALOGO.find(y=>y.c===cod); if(!x) return;
  if(est.entregas.some(e=>e.c===cod)) return;
  est.entregas.push({c:x.c, e:x.e, m:x.m, tipo:"qtd", obj:null});
  render();
}
function remover(cod){
  est.entregas=est.entregas.filter(e=>e.c!==cod);
  for(const mapa of [est.meta, est.real, est.causas])
    for(const k of [...mapa.keys()]) if(String(k).startsWith(cod+"|")) mapa.delete(k);
  est.antes.delete(cod); est.agora.delete(cod);
  render();
}
function setTipo(cod,t){
  const e=est.entregas.find(x=>x.c===cod); if(!e) return;
  e.tipo=t;
  for(const mapa of [est.meta, est.real])
    for(const k of [...mapa.keys()]) if(String(k).startsWith(cod+"|")) mapa.delete(k);
  render();
}
function setCiclo(v){ est.ciclo=v; gravarPlanejamento(); renderCorpo(); }
function setObj(cod,v){
  const e=est.entregas.find(x=>x.c===cod); if(!e) return;
  e.obj = v || null;
  gravarPlanejamento();
  renderCorpo();
}
function limparObj(cod){ setObj(cod, null); }

/* digitar não repinta a grade inteira: o campo perderia o foco */
function setValor(qual,cod,i,v,el){
  const mapa = qual==="meta" ? est.meta : est.real;
  v==="" ? mapa.delete(chave(cod,i)) : mapa.set(chave(cod,i), v);
  el.classList.toggle("vazio", v==="");
  const e=est.entregas.find(x=>x.c===cod);
  const pe=$("pe"+cod+"_"+i);
  if(pe && e) pe.innerHTML = rodapeCelula(e,i);
  atualizarResumos();
}
function girarSN(cod,i,qual){
  const mapa = qual==="meta" ? est.meta : est.real;
  const v=mapa.get(chave(cod,i));
  const prox = v===undefined ? "sim" : v==="sim" ? "nao" : undefined;
  prox===undefined ? mapa.delete(chave(cod,i)) : mapa.set(chave(cod,i), prox);
  render();
}
function setAntes(cod,v){
  v==="" ? est.antes.delete(cod) : est.antes.set(cod, +v);
  atualizarReprimida(cod);
}
function setAgora(cod,v){
  /* só guarda como correção se divergir do calculado — assim o campo não
     vira "preenchido pelo gestor" só porque ele clicou nele */
  const e=est.entregas.find(x=>x.c===cod); if(!e) return;
  const g=geradaNoPeriodo(e), calc=(+est.antes.get(cod)||0)+(g?g.s:0);
  if(v==="" || +v===calc) est.agora.delete(cod); else est.agora.set(cod, +v);
  const r=$("r"+cod);
  if(r){ const c=est.agora.has(cod); r.textContent=c?"corrigido por você":"calculado"; r.className="dr-nota"+(c?" corr":""); }
}
function atualizarReprimida(cod){
  const e=est.entregas.find(x=>x.c===cod); if(!e||!acumula(e)) return;
  const g=geradaNoPeriodo(e), r=acumuladoHoje(e);
  const gEl=$("g"+cod);
  if(gEl) gEl.innerHTML = `${g.meses?(g.s>0?"+":"")+fmt(g.s):"—"}<small>${g.meses?`${g.meses} ${g.meses===1?"mês":"meses"}`:"sem dados"}</small>`;
  const campo=$("h"+cod);
  if(campo && !r.corrigido) campo.value = r.v;
}
function atualizarResumos(){
  renderCtx(); renderAbas();
  for(const e of est.entregas.filter(acumula)) atualizarReprimida(e.c);
  const f=document.querySelector(".falta"); if(f) f.outerHTML = blocoPeriodo();
  const tp=document.querySelector(".tp"); if(tp && !est.buscaAberta && !est.verLacunas){
    const d=document.createElement("div"); d.innerHTML=rodapeTabela();
    tp.replaceWith(...d.childNodes);
  }
  renderCal();
}

/* ---------- balãozinho "o que aconteceu" ---------- */
function abrirPop(ev, cod, i){
  ev.stopPropagation();
  est.pop={cod, i, alvo:ev.currentTarget};
  pintarPop();
  posicionarPop(ev.currentTarget);
  $("pop").classList.add("on");
}
function pintarPop(){
  if(!est.pop) return;
  const {cod,i}=est.pop;
  const e=est.entregas.find(x=>x.c===cod); if(!e) return;
  const k=chave(cod,i), c=causasDe(cod,i), suf=TIPOS[e.tipo].suf;
  const detalhe = e.tipo==="sn"
    ? "estava prevista e não ocorreu"
    : `saiu ${fmt(est.real.get(k))}${suf} de ${fmt(est.meta.get(k))}${suf}`;
  $("pop").innerHTML = `
    <div class="pop-t">O que aconteceu em ${MESES[i]}?</div>
    <div class="pop-d">${e.e} · ${detalhe}</div>
    <div class="tags">${MOTIVOS.map(mo=>`
      <button class="tag ${c.includes(mo)?"on":""}" onclick="girarCausa(event,'${cod}',${i},'${mo}')">${mo}</button>`).join("")}</div>
    <div class="pop-pe">
      <span class="pop-n">${c.length ? `${c.length} ${c.length===1?"anotação":"anotações"}` : "opcional — pode fechar sem escolher"}</span>
      <button class="pop-ok" onclick="fecharPop()">pronto</button>
    </div>`;
}
function posicionarPop(alvo){
  const p=$("pop"), r=alvo.getBoundingClientRect();
  p.style.visibility="hidden"; p.classList.add("on");
  const alt=p.offsetHeight, larg=p.offsetWidth;
  let x = r.left + r.width/2 - larg/2;
  let y = r.bottom + 9;
  x = Math.max(12, Math.min(x, window.innerWidth - larg - 12));
  if(y + alt > window.innerHeight - 12) y = Math.max(12, r.top - alt - 9);
  p.style.left=x+"px"; p.style.top=y+"px"; p.style.visibility="visible";
}
function fecharPop(){ est.pop=null; $("pop").classList.remove("on"); }
/* Marcar uma etiqueta NÃO pode repintar o balão inteiro: o botão
   clicado sairia do DOM no meio do próprio clique, e o "clicou
   fora" lá embaixo fecharia o balão na cara do gestor. Aqui só a
   classe do botão e o rodapé mudam. */
function girarCausa(ev,cod,i,motivo){
  ev.stopPropagation();
  const k=chave(cod,i);
  const atual=est.causas.get(k)||[];
  const nova = atual.includes(motivo) ? atual.filter(x=>x!==motivo) : [...atual, motivo];
  nova.length ? est.causas.set(k, nova) : est.causas.delete(k);
  ev.currentTarget.classList.toggle("on", nova.includes(motivo));
  const n=$("pop").querySelector(".pop-n");
  if(n) n.textContent = nova.length
    ? `${nova.length} ${nova.length===1?"anotação":"anotações"}`
    : "opcional — pode fechar sem escolher";
  /* o pontinho e a lista precisam refletir a escolha sem fechar o balão */
  const pe=$("pe"+cod+"_"+i);
  const e=est.entregas.find(x=>x.c===cod);
  if(pe && e) pe.innerHTML = rodapeCelula(e,i);
  if(est.verLacunas){
    const ll=document.querySelector(".ll");
    if(ll){ const d=document.createElement("div"); d.innerHTML=listaLacunas(lacunas()); ll.replaceWith(d.firstElementChild); }
  }
  const tp=document.querySelector(".convite");
  if(tp){ const sc=semCausa().length;
    tp.querySelector("span").innerHTML = sc
      ? `<b>${sc}</b> ${sc===1?"resultado ficou":"resultados ficaram"} abaixo do previsto. Se quiser, conte o que aconteceu.`
      : `Tudo o que ficou abaixo do previsto já tem uma anotação sua.`;
  }
}

function recomecar(){ limparPassos(); location.reload(); }
function gerarDft(){
  const ined=mesesIneditos();
  if(!tudoPronto()) return;
  const j=lerPassos();
  const rot="DFT "+MESES[ined[0]]+"–"+MESES[ined[ined.length-1]]+"/"+ANO;
  est.retratos.push({id:est.retratos.length+1, rot, meses:[...ined],
    em:new Date().toLocaleDateString("pt-BR"), nec:(j.equipe&&j.equipe.equivalente)||"—",
    qtd:est.entregas.length, pessoas:(j.equipe&&j.equipe.qtd)||null});
  limparPasso("equipe");
  est.mesesSel=new Set();
  render();
  alert(rot+" gerado.\n\nOs meses entraram no retrato e ficam travados.");
}

document.addEventListener("keydown", e=>{
  if(e.key!=="Escape") return;
  if(est.pop) fecharPop(); else if(est.gaveta) fecharGavetas();
});
document.addEventListener("click", e=>{
  if(est.pop && !$("pop").contains(e.target)) fecharPop();
});
window.addEventListener("resize", ()=>{ if(est.pop) fecharPop(); });
document.addEventListener("scroll", ()=>{ if(est.pop) fecharPop(); }, true);

lerPlanejamento();
render();
</script>
